title: "김로그의 우당탕탕"
url: "https://kimlog.pages.dev"
lang: ko
description: "KIMLOG―Need, Learn and Build"
logo: /assets/images/profile.png
future: false
timezone: Asia/Seoul
exclude:
  - "**/draft-*.md"
  # Astro 이관 병존 — Jekyll 빌드가 Astro 산출물을 건드리지 않게 제외
  - node_modules
  - src
  - dist
  - .astro
  - package.json
  - package-lock.json
  - astro.config.mjs
  - tsconfig.json
theme: minima
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap
collections:
  content:
    output: true
    permalink: /:path/
  reviews:
    output: false
header_pages:
  - devlog.html
  - ue5.html
  - audio.html
  - apps.html
  - til.html
  - contact.html
